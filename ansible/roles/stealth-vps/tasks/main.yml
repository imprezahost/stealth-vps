---
# stealth-vps role — main task entry.
#
# Each block is split into a focused task file so every step is auditable.
# Files that are not yet implemented are commented out; uncomment them as
# they land in the respective sprint.

- name: Assert supported distribution
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
    fail_msg: "stealth-vps currently supports Debian 12+ and Ubuntu 22.04+ only."

# CPU architecture is resolved once up front so per-component tasks can
# reference `stealth_vps_arch` (amd64 / arm64) when building upstream
# binary URLs and bundled-binary paths. Adding a new arch only requires
# extending `stealth_vps_arch_map` in defaults — every consumer reads
# from this fact.
- name: Resolve target CPU architecture
  ansible.builtin.set_fact:
    stealth_vps_arch: "{{ stealth_vps_arch_map.get(ansible_facts.architecture, '__unsupported__') }}"

- name: Assert supported CPU architecture
  ansible.builtin.assert:
    that:
      - stealth_vps_arch != '__unsupported__'
    fail_msg: >-
      stealth-vps supports {{ stealth_vps_arch_map.values() | join(', ') }} only
      (architecture detected: {{ ansible_facts.architecture }}).
      Add a mapping under `stealth_vps_arch_map` in defaults/main.yml if you
      want to try an unvalidated architecture — Xray-core, Hysteria2, and 3X-UI
      all publish more variants than we currently smoke-test.

# v0.10.0 multi-node mode mutex. A host is either a CONTROL (holds the
# fleet config + propagates users.index.json over SSH) or a DATA NODE
# (terminates Reality / Hysteria2). Both at once doesn't make sense —
# the control wouldn't know whose users.index.json wins (its own
# locally-generated default vs. the one the operator is curating),
# and the data node would receive its own pushes. Catch it loud, with
# a fix-up message in the assert text rather than a confused stack
# trace 10 tasks later.
- name: Assert control mode and data-plane services are not both enabled
  ansible.builtin.assert:
    that:
      - not (stealth_vps_control_enabled | bool and
             ((stealth_vps_reality_enabled | bool) or
              (stealth_vps_hysteria_enabled | bool) or
              (stealth_vps_panel_enabled | bool)))
    fail_msg: >-
      stealth_vps_control_enabled=true conflicts with reality/hysteria/panel.
      A control box doesn't terminate proxy traffic — it pushes
      users.index.json to data nodes over SSH. Set
      `stealth_vps_reality_enabled: false`, `stealth_vps_hysteria_enabled: false`,
      and `stealth_vps_panel_enabled: false` on the control inventory,
      or flip `stealth_vps_control_enabled: false` if you meant single-node.
      See docs/internal/roadmap-v0.10-multi-node.md for the design.

- name: Apply kernel tuning (BBR, fq, TCP buffers)
  ansible.builtin.include_tasks: kernel.yml
  tags: [kernel, sysctl]

- name: Provision TLS cert (Let's Encrypt) when a domain is configured
  ansible.builtin.include_tasks: tls.yml
  tags: [tls, acme]

- name: Install and configure 3X-UI panel
  ansible.builtin.include_tasks: panel.yml
  when: stealth_vps_panel_enabled | bool
  tags: [panel, 3xui]

- name: Configure Reality inbound (VLESS-Reality via Xray)
  ansible.builtin.include_tasks: xray.yml
  when: stealth_vps_reality_enabled | bool
  tags: [xray, reality]

- name: Install and configure Hysteria2 server
  ansible.builtin.include_tasks: hysteria.yml
  when: stealth_vps_hysteria_enabled | bool
  tags: [hysteria, hysteria2]

- name: Install Prometheus node_exporter (observability)
  ansible.builtin.include_tasks: observability.yml
  when: stealth_vps_observability_enabled | bool
  tags: [observability]

# v0.11.0 Block B — separate-daemon protocols. Both run only in headless
# mode (no panel) since they don't integrate with 3X-UI. The config
# render + service reload on day-2 mutations is owned by the reloader
# (headless_reload.yml); these tasks install the binary + state + unit.

- name: Install and configure Trojan-Go server
  ansible.builtin.include_tasks: trojan_go.yml
  when:
    - stealth_vps_trojan_go_enabled | bool
    - not (stealth_vps_panel_enabled | bool)
  tags: [trojan]

- name: Generate Trojan-Go state (port) for the reloader/sub bundle
  # When Trojan-Go is enabled the state file is created by trojan_go.yml
  # above. This standalone include covers the (rare) case where an
  # operator wants the state generated without the full daemon install
  # — e.g. a control box building sub bundles. No-op when the file
  # already exists.
  ansible.builtin.include_tasks: trojan_go_state.yml
  when:
    - stealth_vps_trojan_go_enabled | bool
    - stealth_vps_control_enabled | bool
  tags: [trojan]

- name: Install and configure WireGuard server
  ansible.builtin.include_tasks: wireguard.yml
  when:
    - stealth_vps_wireguard_enabled | bool
    - not (stealth_vps_panel_enabled | bool)
  tags: [wireguard, wg]

# --- v0.6.0: users index + Python pkg + bot + sub + CLI ----------------
# Ordering: users_index needs reality.state.yml + hysteria.state.yml on
# disk (created by xray.yml + hysteria.yml above). Python pkg seeds the
# bot and the metrics updater, so it goes before bot.yml. Subscription
# and bot are opt-in via defaults; CLI is on by default.

# v0.10.0 control mode: provision the fleet/ + keys/ directories before
# python_pkg.yml runs (the shared package's fleet module imports paths
# from /etc/stealth-vps/fleet/). Idempotent + only acts when
# stealth_vps_control_enabled=true. Single-node hosts are unaffected.
- name: Bootstrap control-plane directories (multi-node mode)
  ansible.builtin.include_tasks: control_bootstrap.yml
  when: stealth_vps_control_enabled | bool
  tags: [control, fleet]

- name: Install shared Python package (used by metrics updater + bot + CLI)
  ansible.builtin.include_tasks: python_pkg.yml
  tags: [python_pkg, bot, cli]

- name: Seed users.index.json from the existing state files
  ansible.builtin.include_tasks: users_index.yml
  tags: [users, index]

# Headless-mode multi-client reload. In panel mode the 3X-UI panel API
# is the source of truth — overwriting Xray's config.json out from
# under it would crash the panel's reconciliation. ThreeXUIBackend
# pushes updates through the API instead, so this whole block is
# panel-mode-disabled at the `when:` gate.
#
# Also a no-op when BOTH reality and hysteria are off: the reloader
# would just exit 0, but skipping the include avoids an extra
# python-launch round-trip per converge in the molecule default
# scenario (which has every protocol disabled).
- name: Re-render multi-client configs from users.index.json (headless mode)
  ansible.builtin.include_tasks: headless_reload.yml
  when:
    - not (stealth_vps_panel_enabled | bool)
    - >-
      (stealth_vps_reality_enabled | bool)
      or (stealth_vps_hysteria_enabled | bool)
      or (stealth_vps_trojan_go_enabled | default(false) | bool)
      or (stealth_vps_wireguard_enabled | default(false) | bool)
  tags: [users, index, headless]

- name: Install Telegram bot (opt-in)
  ansible.builtin.include_tasks: bot.yml
  when: stealth_vps_bot_enabled | bool
  tags: [bot]

- name: Install Caddy + subscription endpoint (opt-in)
  ansible.builtin.include_tasks: subscription.yml
  when: stealth_vps_subscription_enabled | bool
  tags: [subscription, caddy]

# Onboarding bridge (v0.12.0). Install-or-remove based on
# stealth_vps_onboard_enabled; the static bundle rides on the Caddy
# install from subscription.yml above (the Caddyfile route is rendered
# there). The expose-required assert lives inside onboard.yml.
- name: Install (or remove) onboarding bridge web UI
  ansible.builtin.include_tasks: onboard.yml
  tags: [onboard, caddy]

- name: Install /usr/local/bin/s-vps operator CLI wrapper
  ansible.builtin.include_tasks: cli_wrapper.yml
  when: stealth_vps_cli_install | bool
  tags: [cli, s-vps]

# Subscription TTL daily prune (v0.9.0). Stays included unconditionally
# because the file itself decides between install + uninstall depending
# on stealth_vps_sub_prune_enabled. That way an operator who flips the
# flag from true to false gets the units removed on the next converge
# without needing extra steps.
- name: Install (or remove) daily subscription-TTL prune timer
  ansible.builtin.include_tasks: sub_prune.yml
  tags: [sub, prune, systemd]

# Auto-update opt-in (v0.9.0). Same install-or-remove pattern as
# sub_prune.yml — the task file decides based on the flag, so flipping
# false → true → false is handled by re-running ansible-pull. The
# auto-update timer needs the s-vps wrapper + python pkg, both of
# which were already installed by the blocks above.
- name: Install (or remove) auto-update timer
  ansible.builtin.include_tasks: auto_update.yml
  tags: [auto-update, systemd]

# Encrypted backup via age (v0.9.0). Install-or-remove based on
# stealth_vps_backup_enabled; the optional daily timer is gated
# separately by stealth_vps_backup_timer_enabled. Operators who want
# CLI access only (drive backups from a control box via SSH) leave the
# timer off and just run `s-vps backup` when they need it.
- name: Install (or remove) age + backup tooling
  ansible.builtin.include_tasks: backup.yml
  tags: [backup, age]

# Health-check Prometheus exporter (v0.9.0). Off by default — operators
# on the v0.6.0 node-exporter textfile-collector flow already have this
# data. Same install-or-remove pattern, gated by
# stealth_vps_health_exporter_enabled.
- name: Install (or remove) health-check Prometheus exporter
  ansible.builtin.include_tasks: health_exporter.yml
  tags: [health, prometheus]
