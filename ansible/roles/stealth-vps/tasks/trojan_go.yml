---
# Trojan-Go server install + config (v0.11.0+).
#
# Runs when stealth_vps_trojan_go_enabled=true. Downloads the upstream
# binary (a zip asset), renders config.json from users.index.json +
# trojan_go.state.yml, drops a hardened systemd unit, starts the
# service. Per-user passwords come from the index (trojan_password);
# `s-vps user add` + the reloader re-render config.json on mutations.
#
# Trojan-Go REQUIRES a real TLS cert. When stealth_vps_domain is set we
# use the Let's Encrypt cert under stealth_vps_tls_dir; otherwise we
# reuse the Hysteria2 self-signed cert (clients then need allowInsecure,
# which the URI builder sets when no domain is configured).

- name: Resolve effective TLS cert/key for Trojan-Go
  # Domain set → LE cert. No domain → reuse Hysteria's self-signed pair
  # (generated by hysteria.yml). Documented limitation: Trojan-Go without
  # a domain serves a self-signed cert; clients import with allowInsecure.
  ansible.builtin.set_fact:
    stealth_vps_trojan_go_effective_cert: >-
      {{ (stealth_vps_tls_dir + '/fullchain.pem')
         if (stealth_vps_domain | default('', true) | length > 0)
         else (stealth_vps_hysteria_config_dir + '/server.crt') }}
    stealth_vps_trojan_go_effective_key: >-
      {{ (stealth_vps_tls_dir + '/privkey.pem')
         if (stealth_vps_domain | default('', true) | length > 0)
         else (stealth_vps_hysteria_config_dir + '/server.key') }}
  tags: [trojan]

- name: Ensure trojan-go config dir exists
  ansible.builtin.file:
    path: "{{ stealth_vps_trojan_go_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  tags: [trojan]

- name: Check installed trojan-go version
  ansible.builtin.command:
    cmd: "{{ stealth_vps_trojan_go_bin }} --version"
  register: stealth_vps_trojan_go_installed
  changed_when: false
  failed_when: false
  tags: [trojan]

- name: Install trojan-go binary (download + unzip)
  when: >-
    stealth_vps_trojan_go_installed.rc != 0
    or stealth_vps_trojan_go_version | regex_replace('^v', '')
       not in (stealth_vps_trojan_go_installed.stdout | default('', true))
  tags: [trojan]
  block:

    - name: Ensure unzip is present (trojan-go ships a zip asset)
      ansible.builtin.apt:
        name: unzip
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Download + extract trojan-go {{ stealth_vps_trojan_go_version ~ ' (' ~ stealth_vps_arch ~ ')' }}
      ansible.builtin.unarchive:
        src: >-
          https://github.com/p4gefau1t/trojan-go/releases/download/{{
          stealth_vps_trojan_go_version }}/trojan-go-linux-{{ stealth_vps_arch }}.zip
        dest: /usr/local/bin
        remote_src: true
        include:
          - trojan-go
        owner: root
        group: root
        mode: '0755'

- name: Load users index for the trojan config seed render
  ansible.builtin.include_vars:
    file: "{{ stealth_vps_users_index_path }}"
    name: stealth_vps_users_index
  failed_when: false
  tags: [trojan]

- name: Render trojan-go config.json
  ansible.builtin.template:
    src: trojan-go-config.json.j2
    dest: "{{ stealth_vps_trojan_go_config_dir }}/config.json"
    owner: root
    group: root
    mode: '0640'
  notify: Restart trojan-go
  tags: [trojan]

- name: Render trojan-go systemd unit
  ansible.builtin.template:
    src: trojan-go.service.j2
    dest: /etc/systemd/system/trojan-go.service
    owner: root
    group: root
    mode: '0644'
  register: stealth_vps_trojan_go_unit
  tags: [trojan]

- name: Systemd daemon-reload after trojan-go unit change
  ansible.builtin.systemd:
    daemon_reload: true
  when: stealth_vps_trojan_go_unit.changed
  tags: [trojan]

- name: Enable + start trojan-go (skip start in docker/molecule)
  ansible.builtin.systemd:
    name: trojan-go.service
    enabled: true
    state: "{{ 'started' if ansible_facts.virtualization_type | default('') != 'docker' else omit }}"
  tags: [trojan]
